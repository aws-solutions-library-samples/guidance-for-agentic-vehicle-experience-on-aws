---
# Basic CI lint workflow.
#
# Runs on push to main and on every PR. Performs lightweight static checks
# on YAML, Python, and shell scripts. Does NOT run CodeQL - that is
# handled by the org's Default Setup CodeQL configuration.
#
# This workflow exists primarily to give the public repo's CI surface
# something useful to do, and to provide the Default Setup Actions
# language scanner a workflow file to analyze.
#
# CVX language mix: Python (agents/, lambdas/, evals/, scripts/) +
# TypeScript (infrastructure/) + Bash (scripts/*.sh).
# yamllint covers .github/workflows/; shellcheck covers *.sh;
# flake8 covers the Python layer (E/F errors only, no style churn).

name: Lint

"on":
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  yaml-lint:
    name: YAML lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        # yamllint disable-line rule:line-length
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set up Python
        # yamllint disable-line rule:line-length
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.13"

      - name: Install yamllint
        run: pip install --no-input "yamllint==1.35.1"

      - name: Run yamllint
        run: |
          yamllint --no-warnings \
            --config-data '{extends: default, rules: {
              line-length: disable,
              document-start: disable,
              truthy: {check-keys: false}}}' \
            .github/workflows/ || true

  python-lint:
    name: Python lint (flake8)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        # yamllint disable-line rule:line-length
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set up Python
        # yamllint disable-line rule:line-length
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: "3.13"

      - name: Install flake8
        run: pip install --no-input "flake8==7.1.2"

      - name: Run flake8
        # E/F errors only (syntax + undefined names). W (style) and C
        # (complexity) are suppressed. E501/E402 also ignored to avoid
        # line-length and module-level import ordering noise.
        run: |
          flake8 \
            --select=E,F \
            --extend-ignore=E501,E402 \
            --max-line-length=200 \
            agents/ lambdas/ evals/ scripts/ || true

  shell-lint:
    name: ShellCheck
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        # yamllint disable-line rule:line-length
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Run shellcheck
        run: |
          if find . -path ./.venv -prune \
               -o -name '*.sh' -print \
               | head -1 | read; then
            sudo apt-get install -y -qq shellcheck
            find . -path ./.venv -prune \
              -o -name '*.sh' -print \
              -exec shellcheck -e SC1091,SC2086,SC2155 {} + || true
          fi
