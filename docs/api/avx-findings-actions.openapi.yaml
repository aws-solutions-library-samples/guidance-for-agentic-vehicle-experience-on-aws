openapi: "3.1.0"
info:
  title: AVX Findings & Actions API
  version: "1.0.0"
  description: |
    Frozen Spec 1a API contract for the `/findings/*` and `/actions/*` HTTP surface.
    Authored in Spec 1a (`2026-09-18-avx-tier2-ios-cards-and-actions`).
    **Inherited by Spec 1b and Spec 2 by reference — do not re-declare.**

    Base URL: `${CVX_API_ENDPOINT}` (existing per-stage CVX API Gateway endpoint,
    e.g. `https://api.staging.vsa.example.com`).

    Authentication: Bearer token — Cognito JWT supplied in `Authorization: Bearer <token>`.
    The existing API Gateway Cognito JWT authorizer validates the token and forwards claims
    to the Lambda handler.

    Pagination: list routes return opaque `next_token` (base64-encoded cursor, per existing
    CVX API conventions). Omit or pass `null` for first page.

    Stub routes: `/findings/fleet/{fleet_id}`, `/findings/dealership/{dealer_id}`,
    `/findings/district/{district_id}` (and their `/actions/*` equivalents) are **live
    routes with scope authorizers wired** but their handlers return `200 + empty list`
    until Spec 3 (fleet) and Spec 2 (dealer / district) light up.
  contact:
    name: CVX Platform Team

servers:
  - url: "{CVX_API_ENDPOINT}"
    description: Per-stage CVX API Gateway
    variables:
      CVX_API_ENDPOINT:
        default: "https://api.staging.vsa.example.com"
        description: Stage-specific base URL (set via CDK context `vsaApiEndpoint`).

tags:
  - name: findings
    description: Tier 2 agent Findings — read surfaces by scope.
  - name: actions
    description: Tier 2 Actions — CRUD + state transitions.

security:
  - CognitoJwt: []

paths:

  # ─────────────────────────────────────────────────────────────────────────────
  # FINDINGS — read surfaces
  # ─────────────────────────────────────────────────────────────────────────────

  /findings/me:
    get:
      operationId: listFindingsForCaller
      tags: [findings]
      summary: List Findings for every scope the caller holds
      description: |
        Returns open Findings for whatever the caller is entitled to, chronological descending,
        merged across scopes. The caller names no scope — the server derives every scope from the
        caller's verified claims, reads each, and reports which ones it used in `standings`.

        This is the route a **driver** uses. Every other findings route needs a scope identifier in
        its path, and a driver has none to give: their `sub` is not the owner id of the vehicle they
        drive. Clients should prefer this route over guessing a path.

        **Scope derivation** (no query or body parameter selects a scope):
        - `vehicle` — from the verified `custom:vehicleId` claim. One vehicle per driver identity;
          Findings for other vehicles sold to the same customer are not returned.
        - `owner` — the caller's `sub` matched against the CMS registry's owner field.
        - `fleet`, `dealership`, `district` — from the corresponding `custom:*` claims, each only
          when that pool's claim is attested (see `docs/identity-and-standing-contract.md` § 5.1).

        **No standing is a 200, not a 403**: a caller with no vehicle, no fleet and no dealership
        gets `200 {"findings": [], "standings": []}`. A 403 would tell a probing caller that some
        scope exists and was refused.

        Expired Findings are omitted, so a card for a fault that has since cleared does not return.
      parameters:
        - $ref: "#/components/parameters/NextToken"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/SeverityFilter"
        - $ref: "#/components/parameters/FindingKindFilter"
      responses:
        "200":
          description: |
            OK. Also returned when the caller holds no standing at all, with both arrays empty.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CallerFindingListResponse"
              examples:
                driver_one_vehicle:
                  summary: A driver with one assigned vehicle
                  value:
                    findings:
                      - finding_id: "FIND-4a9b0c1d-e2f3-4567-89ab-cdef01234567"
                        finding_kind: "health.diagnostics"
                        severity: "now"
                        scope:
                          vin: "1FTFW1ED5MFB12345"
                        computed_at: "2026-09-28T17:35:00Z"
                        expires_at: "2026-09-28T18:05:00Z"
                    standings: ["vehicle"]
                    next_token: null
                    computed_at: "2026-09-28T17:35:00Z"
                no_standing:
                  summary: A signed-in caller with no vehicle, fleet or dealership
                  value:
                    findings: []
                    standings: []
                    next_token: null
        "401":
          $ref: "#/components/responses/Unauthorized"

  /findings/vehicle/{vin}:
    get:
      operationId: listFindingsByVehicle
      tags: [findings]
      summary: List Findings by VIN
      description: |
        Returns open Findings scoped to the given VIN, chronological descending.

        **Scope authorizer**: caller must be one of:
        - `vehicle-owner` group — Cognito `sub` must match the vehicle's registered owner
        - `fleet-driver` group — fleet membership validated via `custom:fleetIds`
        - `service-advisor` Cognito group or `custom:role=service-advisor` claim
        - `technician` Cognito group or `custom:role=technician` claim
        - `platform-admin` group (cross-scope)
        - `fleet-operator` group with confirmed fleet membership for this VIN

        Callers who pass auth but fail scope get `403`.

        **Paging for owner-group callers**: an `owner`-group caller reads its own partition and is
        filtered to the requested VIN afterwards, so a page can come back with **no items and a
        non-null `next_token`**. That is not the end of the results — keep following the cursor
        until `next_token` is null. A client that stops at the first empty page will miss Findings.
      parameters:
        - $ref: "#/components/parameters/VinPath"
        - $ref: "#/components/parameters/NextToken"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/SeverityFilter"
        - $ref: "#/components/parameters/FindingKindFilter"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FindingListResponse"
              examples:
                agent2_tires_finding:
                  summary: Agent 2 health.tires Finding (LLM path)
                  value:
                    findings:
                      - finding_id: "FIND-4a9b0c1d-e2f3-4567-89ab-cdef01234567"
                        finding_key: "a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2"
                        agent_id: "agent-2-vehicle-health"
                        agent_version: "1.0.0"
                        scope:
                          vin: "1FTFW1ED5MFB12345"
                        severity: "soon"
                        computed_at: "2026-09-18T02:00:00Z"
                        expires_at: "2026-09-25T02:00:00Z"
                        confidence: "high"
                        finding_kind: "health.tires"
                        headline: "Front-left tire pressure 24 PSI — 4 PSI below minimum; rotation overdue by 2,400 km"
                        detail: |
                          **Tire pressure alert**: The front-left tire is reading 24 PSI, 4 PSI below the
                          minimum recommended 28 PSI for your F-150. Continued driving at this pressure
                          increases wear rate and fuel consumption.

                          **Rotation**: Your last rotation was recorded at 38,200 km; you are now at
                          40,600 km, 2,400 km past the recommended 2,000 km interval.

                          *Based on live ADP telemetry signals as of 2026-09-18.*
                        evidence:
                          - kind: "tire_pressure_reading"
                            source: "adp-staging"
                            source_ref: "adp/staging/tire_health/snapshot_date=2026-09-18"
                            value:
                              position: "front_left"
                              pressure_psi: 24
