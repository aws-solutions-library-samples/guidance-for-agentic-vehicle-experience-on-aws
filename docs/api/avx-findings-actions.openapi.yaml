                            source_ref: "adp/staging/vehicle_telemetry_aggregated/snapshot_date=2026-09-18"
                            value:
                              odometer_km: 40600
                            computed_at: "2026-09-18T01:45:00Z"
                            provenance: "live"
                        inputs_hash: "a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2"
                        tokens_used: 312
                        cost_usd: 0.00023
                        audit_trail: []
                    next_token: null
                    computed_at: "2026-09-18T02:00:00Z"
                agent2_deterministic_fallback:
                  summary: Agent 2 health.brakes Finding (deterministic fallback; tokens_used=0)
                  value:
                    findings:
                      - finding_id: "FIND-bbbb0001-0002-0003-0004-000000000005"
                        finding_key: "c1c2c3c4c5c6c7c8c9cacbcccdcecfd0d1d2d3d4d5d6d7d8d9dadbdcdddedfe0"
