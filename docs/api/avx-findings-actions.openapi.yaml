  /findings/fleet/{fleet_id}:
    get:
      # Machine-readable scope predicate (Fix Group 6 Critical). The guard in
      # tests/schemas/test_finding_action_schemas.py reads THIS, not the prose
      # description below: a substring test over English cannot distinguish an
      # assertion from its negation, which is why the prose guard failed three
      # review cycles. Prose is retained for human readers only.
      # Fix Group 7 W3: removed bypass for fleet routes — platform-admin is an
      # alternative for the GROUP requirement only; the membership predicate still
      # applies. The prose says "AND hold fleet membership" with no bypass clause.
      x-scope-predicate:
        param: fleet_id
        mechanism: "`fleet-operator` or `platform-admin` Cognito group AND fleet membership for `fleet_id` verified via CMS `_lib/fleet_membership.py`"
      operationId: listFindingsByFleet
      tags: [findings]
      summary: "[STUB] List Findings for a fleet (fleet-manager scope)"
      description: |
        Fleet-manager scope. **STUB in Spec 1a — returns `200` with empty list.**
        Route is registered; scope authorizer is wired. Full implementation ships in Spec 3.

        **Scope authorizer** (wired now, enforced now):
        Caller must hold `fleet-operator` or `platform-admin` Cognito group AND hold
        fleet membership for `fleet_id` per `fleet_membership.py`.

        Returns empty list until Spec 3 lights up the fleet-aggregate Findings agent.
      parameters:
        - $ref: "#/components/parameters/FleetIdPath"
        - $ref: "#/components/parameters/NextToken"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: OK — empty list until Spec 3 ships
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FindingListResponse"
              examples:
                stub_empty:
                  summary: Stub response (always empty until Spec 3)
                  value:
                    findings: []
                    next_token: null
                    computed_at: "2026-09-18T02:00:00Z"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /findings/dealership/{dealer_id}:
    get:
      # Machine-readable scope predicate (Fix Group 6 Critical). The guard in
      # tests/schemas/test_finding_action_schemas.py reads THIS, not the prose
      # description below: a substring test over English cannot distinguish an
      # assertion from its negation, which is why the prose guard failed three
      # review cycles. Prose is retained for human readers only.
      x-scope-predicate:
        param: dealer_id
        mechanism: "`dealer-admin` Cognito group AND a DMS dealership role scoped to `dealer_id`"
        bypass: [platform-admin]
      operationId: listFindingsByDealership
      tags: [findings]
      summary: "[STUB] List Findings for a dealership (dealer scope)"
      description: |
        Dealer scope. **STUB in Spec 1a — returns `200` with empty list.**
        Route is registered; scope authorizer is wired. Full implementation ships in Spec 2.

        **Scope authorizer** (wired now, enforced now):
        Caller must hold `dealer-admin` Cognito group AND hold a DMS dealership role for
        `dealer_id`. `platform-admin` bypasses.

        Returns empty list until Spec 2 lights up the dealer-scoped Findings writer.
      parameters:
        - $ref: "#/components/parameters/DealerIdPath"
        - $ref: "#/components/parameters/NextToken"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: OK — empty list until Spec 2 ships
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FindingListResponse"
              examples:
                stub_empty:
                  summary: Stub response (always empty until Spec 2)
                  value:
                    findings: []
                    next_token: null
                    computed_at: "2026-09-18T02:00:00Z"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /findings/district/{district_id}:
    get:
      # Machine-readable scope predicate (Fix Group 6 Critical). The guard in
      # tests/schemas/test_finding_action_schemas.py reads THIS, not the prose
      # description below: a substring test over English cannot distinguish an
      # assertion from its negation, which is why the prose guard failed three
      # review cycles. Prose is retained for human readers only.
      x-scope-predicate:
        param: district_id
        mechanism: "`district-manager` Cognito group AND district membership for `district_id` via the `custom:districtIds` claim"
        bypass: [platform-admin]
      operationId: listFindingsByDistrict
      tags: [findings]
      summary: "[STUB] List Findings for a district (district scope)"
      description: |
        District scope. **STUB in Spec 1a — returns `200` with empty list.**
        Route is registered; scope authorizer is wired. Full implementation ships in Spec 2.

        **Scope authorizer** (wired now, enforced now):
        Caller must hold `district-manager` Cognito group **AND** hold district membership
        for `district_id`. `platform-admin` bypasses the membership predicate only.

        The membership predicate is REQUIRED, not optional. Group membership alone is not
        sufficient authorization: `district-manager` is a role, not a scope, so gating on the
        group alone lets any district manager enumerate every district's Findings. This
        mirrors the predicates the sibling scope routes already carry — `fleet` binds via
        `fleet_membership.py`, `dealership` binds the caller's dealership to `dealer_id` —
        and closes the inconsistency found by security review Cycle 1 W2. Spec 2 MUST ship
        the district-membership lookup (claim or membership table) when it lights this route
        up; a stub handler returning an empty list must not be read as permission to defer it.

        Returns empty list until Spec 2 lights up district aggregation.
      parameters:
        - $ref: "#/components/parameters/DistrictIdPath"
        - $ref: "#/components/parameters/NextToken"
        - $ref: "#/components/parameters/PageSize"
      responses:
        "200":
          description: OK — empty list until Spec 2 ships
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FindingListResponse"
              examples:
                stub_empty:
                  summary: Stub response (always empty until Spec 2)
                  value:
                    findings: []
                    next_token: null
                    computed_at: "2026-09-18T02:00:00Z"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/InternalServerError"

  # ─────────────────────────────────────────────────────────────────────────────
  # FINDINGS → approve (create an Action)
  # ─────────────────────────────────────────────────────────────────────────────

  /findings/{finding_id}/approve:
    post:
      operationId: approveFinding
      tags: [actions]
      summary: Approve a Finding — creates an Action
      description: |
        Creates an Action from a Finding. The executor for `target_system` is called
        synchronously and its result advances the Action (Addendum D5): a success
        status (`in_progress` / `executed` / `completed`) with `target_ref` populated;
        `declined` when the target refused the work; `failed` when retries were
        exhausted or the executor erred, which also fires the D5 escalation. The row
        stays `pending_execution` only if dispatch could not run at all, and the
        response is then a 500 naming the `action_id`. A repeated approve (same
        Finding, `action_kind` and caller) returns the existing Action without
        dispatching again, provided it names the same `target_system` and
        `parameters`; otherwise it is a 409.

        `target_system: dms` requires a caller in the `fleet-operator` or
        `platform-admin` group (the callers DMS's repair-order API admits; others get
        a 403 before anything is written), a VIN-scoped Finding, and
        `parameters.dealer_id` (a DMS rooftop). `parameters.vehicle_vin` is set from
        the Finding's own scope; a different caller-supplied value is a 400.

        **Scope authorizer**: caller must be the owner of the Finding's scope OR hold
        `service-advisor` / `fleet-operator` / `platform-admin` group.

        Evidence from the Finding is copied onto the Action at approval time.
      parameters:
        - $ref: "#/components/parameters/FindingIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApproveFindingRequest"
            examples:
              book_dms_visit:
                summary: Book combined service visit via DMS executor
                value:
                  target_system: "dms"
                  action_kind: "book_combined_visit"
