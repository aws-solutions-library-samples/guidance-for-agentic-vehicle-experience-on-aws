  # ─────────────────────────────────────────────────────────────────────────────
  # ACTIONS — state transitions
  # ─────────────────────────────────────────────────────────────────────────────

  /actions/{action_id}:
    patch:
      operationId: updateAction
      tags: [actions]
      summary: State transition on an Action
      description: |
        Applies a state transition to an Action. Valid transitions depend on `target_system`:

        | Caller role | Allowed transitions |
        |---|---|
        | `dealer` / `service-advisor` | `executed` → `in_progress`, `in_progress` → `completed`, `in_progress` → `declined` |
        | `vehicle-owner` / `consumer` | `pending_execution` → `cancelled`, `executed` → `cancelled` |
        | `platform-admin` | Any transition (no-op audit trail entry added) |

        Invalid transitions return `422`. All transitions are appended to `audit_trail[]`.

        **Scope authorizer**: caller must be the original `created_by` actor OR hold a
        dealer/service-advisor role with scope on the Action's originating Finding.
        `platform-admin` bypasses.
      parameters:
        - $ref: "#/components/parameters/ActionIdPath"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateActionRequest"
            examples:
              dealer_accept:
                summary: Dealer marks RO in-progress
                value:
                  status: "in_progress"
                  note: "Technician assigned — RO SC-ATL-101-20260918"
              owner_cancel:
                summary: Owner cancels a pending action
                value:
                  status: "cancelled"
                  note: "Changed my mind — will use a different service center"
      responses:
        "200":
          description: Updated Action
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Action"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: Unprocessable — invalid state transition
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
              examples:
                invalid_transition:
                  value:
                    error: "INVALID_TRANSITION"
                    message: "Cannot transition from 'completed' to 'cancelled'"
                    request_id: "req-abc123"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /actions/{action_id}/dismiss:
    post:
      operationId: dismissAction
      tags: [actions]
      summary: Dismiss an Action — feeds broker feedback table
      description: |
        Dismisses an Action and writes a dismissal event to the broker feedback table.
        The feedback is consumed by the Tier 2 agent loop for future suppression of
        low-signal Findings (parent PRD § M12).

        **Scope authorizer**: caller must be the `created_by` owner of the Action.
        Dealer/service-advisor may not dismiss an owner-originated Action.
        `platform-admin` bypasses.

        Dismissal is a terminal state — a dismissed Action cannot be re-opened.
      parameters:
        - $ref: "#/components/parameters/ActionIdPath"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DismissActionRequest"
            examples:
              dismiss_with_reason:
                value:
                  reason: "already_handled"
                  note: "Fixed tire pressure myself at a gas station"
      responses:
        "200":
          description: Action dismissed; feedback row written
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Action"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "422":
          description: Unprocessable — Action is already in a terminal state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          $ref: "#/components/responses/InternalServerError"

# =============================================================================
# Components
# =============================================================================

components:

  securitySchemes:
    CognitoJwt:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Cognito JWT issued by the per-stage CVX Cognito User Pool.
        Claims used by the scope authorizer:
        - `sub` — caller's user ID
        - `cognito:groups` — comma-separated Cognito group names
          (e.g. `platform-admin`, `fleet-operator`, `fleet-driver`,
          `vehicle-owner`, `dealer`, `district-manager`)
        - `custom:role` — optional role override claim
          (e.g. `service-advisor`, `technician`)
        - `custom:fleetIds` — JSON-encoded array of fleet IDs the caller belongs to

  parameters:

    VinPath:
      name: vin
      in: path
      required: true
      schema:
        type: string
        pattern: "^[A-HJ-NPR-Z0-9]{17}$"
        example: "1FTFW1ED5MFB12345"
      description: 17-character ISO 3779 VIN.

    OwnerIdPath:
      name: owner_id
      in: path
      required: true
      schema:
        type: string
        example: "USER-12345"
      description: Owner user identifier.

    FleetIdPath:
      name: fleet_id
      in: path
      required: true
      schema:
        type: string
        example: "FLEET-meridian-01"
      description: Fleet identifier.

    DealerIdPath:
      name: dealer_id
      in: path
      required: true
      schema:
        type: string
        example: "DEALER-meridian-atl-101"
      description: Dealership identifier.

    DistrictIdPath:
      name: district_id
      in: path
      required: true
      schema:
        type: string
        example: "DISTRICT-southeast-01"
      description: District identifier.

    FindingIdPath:
      name: finding_id
      in: path
      required: true
      schema:
        type: string
        pattern: "^FIND-[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
        example: "FIND-4a9b0c1d-e2f3-4567-89ab-cdef01234567"
      description: Finding identifier.

    ActionIdPath:
      name: action_id
      in: path
      required: true
      schema:
        type: string
        pattern: "^AVX-ACT-[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
        example: "AVX-ACT-11111111-2222-3333-4444-555555555555"
      description: Action identifier.

    NextToken:
      name: next_token
      in: query
      required: false
      schema:
        type: string
        nullable: true
      description: |
        Opaque base64-encoded pagination cursor returned by a prior list response.
        Omit or pass null/empty string for the first page.

    PageSize:
      name: page_size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
      description: Maximum items per page. Default 20; max 100.

    SeverityFilter:
      name: severity
      in: query
      required: false
      schema:
        type: string
        enum: ["p0", "attention", "soon", "routine", "informational"]
      description: Filter results to a single severity level.

    FindingKindFilter:
      name: finding_kind
      in: query
      required: false
      schema:
        type: string
      description: "Filter by finding_kind prefix (e.g. 'health' matches health.tires, health.brakes, health.battery, health.diagnostics)."

    StatusFilter:
      name: status
      in: query
      required: false
      schema:
        type: string
        enum:
          - "pending_execution"
          - "executed"
          - "in_progress"
          - "completed"
          - "cancelled"
          - "declined"
          - "dismissed"
          - "failed"
      description: |
        Filter by Action status. MUST enumerate every value of `Action.status` —
        `dismissed` (Addendum D4) and `failed` (Addendum D5) included. A filter that
        omits a valid status makes those Actions unfilterable through the API and, with
        API Gateway request validation enabled, returns 400 on a legitimate query.
        Pinned against `action.schema.json` by
        `TestApiContractStatusEnumParity` in tests/schemas/test_finding_action_schemas.py.

  schemas:

    Finding:
      type: object
      description: |
        AVX Tier 2 Finding. Frozen in Spec 1a Group 1.
        Authoritative schema: `agents/tier2/schemas/finding.schema.json`.
      required:
        - finding_id
        - finding_key
        - agent_id
        - agent_version
        - scope
        - severity
        - computed_at
        - expires_at
        - confidence
        - finding_kind
        - headline
        - detail
        - evidence
        - inputs_hash
        - tokens_used
        - cost_usd
        - audit_trail
      properties:
        finding_id:
          type: string
          pattern: "^FIND-[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
          description: Stable UUID. Preserved across in-place updates (Addendum D2).
        finding_key:
          type: string
          pattern: "^[0-9a-f]{64}$"
          description: |
            SHA-256 of canonicalised (agent_id, scope_field, scope_value, finding_kind).
            Stable identity of an open condition. The writer uses this GSI to decide
            UpdateItem (persistent condition) vs PutItem (new condition). Addendum D2.
        agent_id:
          type: string
          enum:
            - "agent-2-vehicle-health"
            - "agent-1-lite-energy"
            - "agent-3-ownership-cost"
            - "agent-4-lite-concierge"
        agent_version:
          type: string
          pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+$"
        scope:
          $ref: "#/components/schemas/FindingScope"
        severity:
          type: string
          enum: ["p0", "attention", "soon", "routine", "informational"]
        computed_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
          description: computed_at + agent freshness TTL. Extended in-place on re-emit (D2).
        confidence:
          type: string
          enum: ["low", "medium", "high"]
        finding_kind:
          type: string
          enum:
            - "health.tires"
            - "health.brakes"
            - "health.battery"
            - "health.diagnostics"
            - "energy.charging"
            - "energy.cost"
            - "coverage.warranty"
            - "coverage.recall"
            - "loyalty.points"
            - "loyalty.expiry"
            - "concierge.appointment"
            - "concierge.service"
        headline:
          type: string
          maxLength: 120
        detail:
          type: string
        evidence:
          type: array
          items:
            $ref: "#/components/schemas/EvidenceEntry"
        inputs_hash:
          type: string
          pattern: "^[0-9a-f]{64}$"
          description: |
            SHA-256 of canonicalised input rows. Role (Addendum D2): retry-safety within
            a single agent execution attempt. Cross-run idempotency is finding_key-based.
        tokens_used:
          type: integer
          minimum: 0
        cost_usd:
          type: number
          minimum: 0.0
        disclosure_txt:
          type: string
          nullable: true
          description: |
            Verbatim disclosure copy, populated only when the finding surfaces a monetary
            figure (PRD § M8). Not present for Spec 1a Agent 2 health findings.
            For monetary `finding_kind` values (coverage.warranty, coverage.recall,
            energy.cost, loyalty.points, loyalty.expiry), this field is REQUIRED and
            must be non-empty — enforced by the `if/then` constraint below (contract v2.2
            security S1 via allOf in the JSON Schema authoritative version).
        audit_trail:
          type: array
          items:
            $ref: "#/components/schemas/FindingAuditEntry"
          description: |
            In-place update history (Addendum D2). Appended on each UpdateItem (re-emit)
            so persistence history is reconstructable from the Finding alone.
      if:
        properties:
          finding_kind:
            enum:
              - "coverage.warranty"
              - "coverage.recall"
              - "energy.cost"
              - "loyalty.points"
              - "loyalty.expiry"
        required: [finding_kind]
      then:
        required: [disclosure_txt]
        properties:
          disclosure_txt:
            type: string
            minLength: 1
            description: |
              Required and non-empty for monetary finding_kind values. Verbatim disclosure
              copy per parent PRD § M8, § M14 and the deterministic-seam rule in
              ~/.kiro/steering/agentic-tiers.md. Contract v2.2 security S1.

    FindingScope:
      type: object
      description: Exactly one field populated. Zero or >1 populated fields = schema bug.
      properties:
        vin:
          type: string
          pattern: "^[A-HJ-NPR-Z0-9]{17}$"
        owner_id:
          type: string
        fleet_id:
          type: string
        dealership_id:
          type: string
        district_id:
          type: string
      minProperties: 1
      maxProperties: 1

    FindingListResponse:
      type: object
      required: [findings, computed_at]
      properties:
        findings:
          type: array
          items:
            $ref: "#/components/schemas/Finding"
        next_token:
          type: string
          nullable: true
          description: Opaque base64 cursor; null on last page.
        computed_at:
          type: string
          format: date-time
          description: |
            Timestamp of the most-recent Tier 2 agent run that produced any item in this
            response. Callers surface this as staleness context per PRD § M5.

    CallerFindingListResponse:
      description: |
        `FindingListResponse` plus the scopes the server actually used. Only `GET /findings/me`
        returns this shape; the scope-named routes return `FindingListResponse`.
      allOf:
        - $ref: "#/components/schemas/FindingListResponse"
        - type: object
          required: [standings]
          properties:
            standings:
              type: array
              description: |
                The scopes the server derived from the caller's claims and read. Empty when the
                caller holds none, which is a 200. Clients must not infer standing themselves.
              items:
                type: string
                enum: [vehicle, owner, fleet, dealership, district]

    Action:
      type: object
      description: |
        AVX Tier 2 Action. Frozen in Spec 1a Group 1.
        Authoritative schema: `agents/tier2/schemas/action.schema.json`.
      required:
        - action_id
        - finding_id
        - created_by
        - created_at
        - updated_at
        - target_system
        - status
        - action_kind
        - parameters
        - evidence
        - audit_trail
      properties:
        action_id:
          type: string
          pattern: "^AVX-ACT-[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
        finding_id:
          type: string
          pattern: "^FIND-[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
        created_by:
          type: string
          description: "Pattern: owner-{id} | dealer-{id} | fleet-manager-{id}"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
          description: |
            ISO-8601 UTC timestamp of the most recent state change on this Action.
            Set equal to `created_at` on creation; updated on every status transition.
            Callers surface this as staleness context per parent PRD § M5.
            Contract Addendum C2 (review Cycle 1 C2).
        target_system:
          type: string
          enum: ["dms", "vehicle-command", "retail", "none", "chat", "ios-owner"]
        target_ref:
          type: string
          nullable: true
          description: Populated by executor on successful dispatch. Null before execution completes.
        status:
          type: string
          enum:
            - "pending_execution"
            - "executed"
            - "in_progress"
            - "completed"
            - "cancelled"
            - "declined"
            - "dismissed"
            - "failed"
          description: |
            `dismissed` — owner tapped Dismiss (terminal, distinct from `cancelled`
            and `declined`). Addendum D4.
            `failed` — executor exhausted retries on transient downstream failure
            (terminal, distinct from `declined` which is a 4xx refusal). Addendum D5.
        action_kind:
          type: string
          enum:
            - "book_combined_visit"
            - "schedule_inspection"
            - "update_charging_schedule"
            - "file_warranty_pre"
            - "surface_recall"
            - "acknowledge_only"
        parameters:
          type: object
          description: Executor-specific parameters.
        evidence:
          type: array
          items:
            $ref: "#/components/schemas/EvidenceEntry"
          description: |
            COPY of Finding evidence[] at approval time. Immutable — later Finding
            re-runs do NOT retroactively mutate this copy.
        audit_trail:
          type: array
          items:
            $ref: "#/components/schemas/ActionAuditEntry"

    ActionListResponse:
      type: object
      required: [actions]
      properties:
        actions:
          type: array
          items:
            $ref: "#/components/schemas/Action"
        next_token:
          type: string
          nullable: true
          description: Opaque base64 cursor; null on last page.

    EvidenceEntry:
      type: object
      required: [kind, source, source_ref, value, computed_at, provenance]
      properties:
        kind:
          type: string
          description: Category of evidence (e.g. 'adp.tires.prediction', 'dms.warranty.verdict').
        source:
          type: string
          description: System that produced this evidence entry.
        source_ref:
          type: string
          description: Opaque reference to the source record (e.g. Athena query ID, DMS RO number).
        value:
          description: Evidence value. Scalar or JSON object.
        computed_at:
          type: string
          format: date-time
        provenance:
          type: string
          enum: ["live", "mocked", "absent"]
          description: |
            live = real data; mocked = partner seam substitute (PRD § M14);
            absent = expected but unavailable.
            Spec 1a Agent 2 always emits provenance="live". The field exists
            because Spec 1b Agent 3 will emit provenance="mocked" for partner comp seams.
        vin:
          type: string
          nullable: true
          description: |
            Optional per-VIN attribution for fleet_id-scoped Findings (Addendum D1).
            Copied onto Action evidence at approval time.

    FindingAuditEntry:
      type: object
      description: |
        In-place Finding update history entry (Addendum D2). Appended on re-emit.
      required: [at, agent_version, inputs_hash, from_expires_at, to_expires_at]
      properties:
        at:
          type: string
          format: date-time
        agent_version:
          type: string
          pattern: "^[0-9]+\\.[0-9]+\\.[0-9]+$"
        inputs_hash:
          type: string
          pattern: "^[0-9a-f]{64}$"
        from_expires_at:
          type: string
          format: date-time
        to_expires_at:
          type: string
          format: date-time
        note:
          type: string
          nullable: true

    ActionAuditEntry:
      type: object
      description: Action state-transition record.
      required: [at, by, from_status, to_status]
      properties:
        at:
          type: string
          format: date-time
        by:
          type: string
        from_status:
          type: string
          enum:
            - "pending_execution"
            - "executed"
            - "in_progress"
            - "completed"
            - "cancelled"
            - "declined"
            - "dismissed"
            - "failed"
        to_status:
          type: string
          enum:
            - "pending_execution"
            - "executed"
            - "in_progress"
            - "completed"
            - "cancelled"
            - "declined"
            - "dismissed"
            - "failed"
        note:
          type: string
          nullable: true
        failure_kind:
          type: string
          enum: ["target_refused", "executor_exhausted_retries", "executor_terminal_error"]
          nullable: true
          description: |
            Required when to_status is 'declined' (target_refused) or 'failed'
            (executor_exhausted_retries | executor_terminal_error). Addendum D5.
        retry_count:
          type: integer
          minimum: 0
          nullable: true
          description: Number of retry attempts before the terminal 'failed' status. Addendum D5.

    ApproveFindingRequest:
      type: object
      description: |
        Body for `POST /findings/{finding_id}/approve` — the path by which the **holder of
        the Finding's scope** approves work on their own Finding.

        **`ios-owner` is NOT an accepted `target_system` on this route.** It is the
        reverse-direction, dealer-to-owner proposal channel. The machine-readable constraint
        below (`oneOf` branches keyed on who may originate each target class) makes this
        unrepresentable rather than relying on handler-side prose (security review Cycle 1
        W1; contract v2.2). The two cases:

        - **Non-ios-owner executors** (`dms`, `vehicle-command`, `retail`, `none`, `chat`):
          any caller who holds the Finding's scope (vehicle-owner, fleet-operator,
          service-advisor, etc.) may approve Actions to these targets.

        - **`ios-owner`** (reverse-direction, dealer-to-owner channel): valid on an `Action`
          object and served by `GET /actions/owner/{owner_id}`; originated exclusively via
          Spec 2's `POST /actions` extension by a caller holding the `dealer` role scoped to
          the Finding's owner. Callers without that role cannot originate `ios-owner` Actions
          through ANY route in Spec 1a, only receive them. This is a channel-policy boundary:
          the broker owns the decision to reach a customer; the approve route does not.

        Handler-side per-target authorization is still required and is NOT replaced by this
        schema constraint: a valid `target_system` here does not imply the caller may use it
        (e.g., a service-advisor may not approve `vehicle-command` actions without additional
        role validation).
      oneOf:
        - description: |
            Non-ios-owner approval (any scope-holder). `target_system` must be one of the
            five non-reverse-direction executors. `ios-owner` is unrepresentable on this
            branch — the schema constraint is machine-readable, not prose.
          required: [target_system, action_kind, parameters]
          properties:
            target_system:
              type: string
              enum: ["dms", "vehicle-command", "retail", "none", "chat"]
              description: |
                Executor target. `ios-owner` excluded — see schema description. The full
                6-value set lives on `Action.target_system`, because an Action with
                `target_system: ios-owner` is valid; it just cannot originate here.
            action_kind:
              type: string
              enum:
                - "book_combined_visit"
                - "schedule_inspection"
                - "update_charging_schedule"
                - "file_warranty_pre"
                - "surface_recall"
                - "acknowledge_only"
            parameters:
              type: object
              description: Executor-specific parameters; shape varies by target_system + action_kind.

    UpdateActionRequest:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum:
            - "in_progress"
            - "completed"
            - "cancelled"
            - "declined"
          description: Target status after the transition. (dismissed is via POST /dismiss; failed is executor-driven.)
        note:
          type: string
          description: Optional audit note appended to audit_trail[].

    DismissActionRequest:
      type: object
      properties:
        reason:
          type: string
          enum:
            - "already_handled"
            - "not_applicable"
            - "too_frequent"
            - "other"
          description: Dismissal reason; written to broker feedback table.
        note:
          type: string
          description: Optional freeform note.

    ErrorResponse:
      type: object
      required: [error, message]
      properties:
        error:
          type: string
          description: Machine-readable error code.
          example: "SCOPE_FORBIDDEN"
        message:
          type: string
          description: Human-readable error description.
          example: "Caller sub does not match the requested owner_id."
        request_id:
          type: string
          description: CloudWatch request ID for log correlation.

  responses:
    BadRequest:
      description: "400 Bad Request — malformed input"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            bad_vin:
              value:
                error: "INVALID_VIN"
                message: "VIN must be exactly 17 characters matching [A-HJ-NPR-Z0-9]{17}."

    Unauthorized:
      description: "401 Unauthorized — missing or invalid Bearer token"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            missing_token:
              value:
                error: "UNAUTHORIZED"
                message: "Authorization header is missing or token is invalid."

    Forbidden:
      description: "403 Forbidden — authenticated but insufficient scope"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            wrong_scope:
              value:
                error: "SCOPE_FORBIDDEN"
                message: "Caller does not hold a group or claim that permits access to this scope."

    NotFound:
      description: "404 Not Found"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            finding_not_found:
              value:
                error: "NOT_FOUND"
                message: "Finding FIND-00000000-0000-0000-0000-000000000000 does not exist."

    InternalServerError:
      description: "500 Internal Server Error"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          examples:
            generic:
              value:
                error: "INTERNAL_ERROR"
                message: "An unexpected error occurred."
                request_id: "req-abc123"

