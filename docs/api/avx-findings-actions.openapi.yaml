          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/InternalServerError"

  /findings/owner/{owner_id}:
    get:
      operationId: listFindingsByOwner
      tags: [findings]
      summary: List Findings by owner (self-read)
      description: |
        Owner self-read. Returns all open Findings across all vehicles the owner holds.

        **Scope authorizer**: caller `sub` must equal `owner_id`, OR the caller's
        `custom:customerId` must equal `owner_id` (only when the stage attests the
        claim is not client-writable, `AVX_CUSTOMER_ID_CLAIM_TRUSTED=true`), OR
        caller is `platform-admin`. `owner_id` is a Cognito `sub` for owner-scoped
        Findings and the CMS party of record (`CUST-XXXXXXXX`) for VIN-scoped
        Findings; see `docs/identity-and-standing-contract.md` § 3. `consumer` and
        `vehicle_owner` Cognito groups are accepted. Fleet memberships are not
        required.
      parameters:
        - $ref: "#/components/parameters/OwnerIdPath"
        - $ref: "#/components/parameters/NextToken"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/SeverityFilter"
        - $ref: "#/components/parameters/FindingKindFilter"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FindingListResponse"
              examples:
                owner_multi_vin:
                  summary: Owner with two vehicles, one finding each
                  value:
                    findings:
                      - finding_id: "FIND-aaaa0001-0002-0003-0004-000000000001"
                        finding_key: "a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2"
                        agent_id: "agent-2-vehicle-health"
                        agent_version: "1.0.0"
                        scope:
                          vin: "1FTFW1ED5MFB12345"
                        severity: "soon"
                        computed_at: "2026-09-18T02:00:00Z"
                        expires_at: "2026-09-25T02:00:00Z"
                        confidence: "high"
                        finding_kind: "health.tires"
                        headline: "Front-left tire pressure 24 PSI — 4 PSI below minimum"
                        detail: "See full detail via GET /findings/vehicle/1FTFW1ED5MFB12345"
                        evidence:
                          - kind: "tire_pressure_reading"
                            source: "adp-staging"
                            source_ref: "adp/staging/tire_health/snapshot_date=2026-09-18"
                            value:
                              position: "front_left"
                              pressure_psi: 24
                            computed_at: "2026-09-18T01:45:00Z"
                            provenance: "live"
                        inputs_hash: "a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2c3d4e5f6a1b2"
                        tokens_used: 312
                        cost_usd: 0.00023
                        audit_trail: []
                    next_token: null
                    computed_at: "2026-09-18T02:00:00Z"
