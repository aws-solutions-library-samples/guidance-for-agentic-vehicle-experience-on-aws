  /findings/owner-fleet/{owner_id}:
    get:
      operationId: listFindingsByOwnerFleet
      tags: [findings]
      summary: List Findings for small-business fleet owned by owner
      description: |
        Small-business fleet-owner scope. Returns Findings across all VINs in fleets
        this owner manages.

        **Scope authorizer**: caller `sub`, or the caller's trusted
        `custom:customerId` (see `listFindingsByOwner`), must equal `owner_id`, OR
        caller is `platform-admin`. A `fleet-operator` is admitted only when it holds
        the owner's fleet; this route has no fleet context to resolve that against,
        so a `fleet-operator` that is not the owner is denied (fails closed).
      parameters:
        - $ref: "#/components/parameters/OwnerIdPath"
        - $ref: "#/components/parameters/NextToken"
        - $ref: "#/components/parameters/PageSize"
        - $ref: "#/components/parameters/SeverityFilter"
        - $ref: "#/components/parameters/FindingKindFilter"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FindingListResponse"
              examples:
                owner_fleet_findings:
                  summary: Fleet owner sees two vehicles' findings
                  value:
                    findings:
                      - finding_id: "FIND-cccc0001-0002-0003-0004-000000000001"
                        finding_key: "f0f1f2f3f4f5f6f7f8f9fafbfcfdfeff00010203040506070809101112131415"
                        agent_id: "agent-2-vehicle-health"
                        agent_version: "1.0.0"
