id: technician-intro-001
description: "Technician asks for vehicle identity and any active DTCs to start diagnostic; calls vehicle_identity and knowledge"
tier: 2
persona: technician
persona_id: technician
vehicle_id: VEH-1001
driver_id: drv-technician-001
input:
  type: text
  utterance: "I'm about to start on this vehicle. What can you tell me about it and any known issues?"
expected:
  tool_calls:
    - name: lookup_vehicle_identity
      args_contain: {}
  routing:
    offers_diy_choice: false
    safety_critical: false
  response:
    must_contain_one_of: ["vehicle", "model", "year", "VIN", "build", "known", "issue", "spec"]
    must_not_contain: ["I cannot retrieve vehicle data", "no information available"]
latency_budget_ms: 5000
