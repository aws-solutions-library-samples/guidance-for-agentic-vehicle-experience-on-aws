id: vehicle-owner-recall-check-001
description: "Vehicle owner asks if their vehicle has any open recalls; agent calls retrieve and lookup_vehicle_identity"
tier: 2
persona: vehicle_owner
persona_id: vehicle_owner
vehicle_id: VEH-1001
driver_id: drv-vehicle-owner-001
input:
  type: text
  utterance: "Does my vehicle have any open recalls?"
expected:
  tool_calls:
    - name: lookup_vehicle_identity
      args_contain: {}
  routing:
    offers_diy_choice: false
    safety_critical: false
  response:
    must_contain_one_of: ["recall", "safety", "NHTSA", "no open recalls", "bulletin", "remedy"]
    must_not_contain: ["I cannot check recalls", "recall information unavailable"]
latency_budget_ms: 5000
