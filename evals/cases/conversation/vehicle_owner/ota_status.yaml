id: vehicle-owner-ota-status-001
description: "Vehicle owner asks about OTA updates; agent calls ota_history tool"
tier: 2
persona: vehicle_owner
persona_id: vehicle_owner
vehicle_id: VEH-1001
driver_id: drv-vehicle-owner-001
input:
  type: text
  utterance: "Are there any software updates for my vehicle?"
expected:
  tool_calls:
    - name: ota_history
      args_contain: {}
  routing:
    offers_diy_choice: false
    safety_critical: false
  response:
    must_contain_one_of: ["update", "OTA", "software", "campaign", "installed", "pending", "over-the-air"]
    must_not_contain: ["I cannot check for updates", "no update information"]
latency_budget_ms: 5000
