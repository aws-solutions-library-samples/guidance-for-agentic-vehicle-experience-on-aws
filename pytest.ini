[pytest]
# asyncio_mode=auto lets us use @pytest.mark.asyncio without per-test setup.
# Needed by agents/supervisor/tests/test_bidi_app.py and test_injection_queue.py.
#
# REQUIRES pytest-asyncio (pinned in agents/supervisor/requirements-dev.txt).
# Without it this option is "unknown", a warning only, and pytest 8.3.3 SKIPS
# every async test and exits 0. That went unnoticed until 2026-10-01
# (issues/2026-10-01-async-tests-inert-and-triage-tests-not-in-ci/).
# agents/supervisor/tests/test_async_plugin_active.py fails when the plugin is absent.
asyncio_mode = auto
# Each async fixture gets a function-scoped event loop. Set explicitly because
# pytest-asyncio warns that its default will change.
asyncio_default_fixture_loop_scope = function

# --import-mode=importlib prevents the module-name collision between the
# top-level tests/ package and lambdas/**/tests/ sub-packages that each define
# a 'tests' module. Without importlib, pytest's legacy prepend-sys-path mode
# imports the first 'tests' package it finds and subsequent ones collide
# ("No module named 'tests.test_X'"). importlib loads each test module with
# a unique namespace keyed on its file path.
addopts = --import-mode=importlib

testpaths =
    agents
    lambdas
    tests
