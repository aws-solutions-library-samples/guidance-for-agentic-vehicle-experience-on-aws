# FI Fleet-Health: needs → labor-op / parts mapping (spec D8 step 2).
#
# Each entry maps a need kind + source discriminator to a labor_op and a list
# of part numbers used for rooftop stock-check.  The loop's `map_need_to_labor_op`
# function resolves each need using this table.
#
# Fault needs: keyed by fault code (every code ADP can raise at band soon or
# worse), falling back to the band entry only for a code ADP doesn't know.
# PM needs: keyed by task_code.
# Agent 2 needs: keyed by finding kind (e.g. "battery", "brakes", "tires").
#
# labor_op is a DMS labor op (LAB-*): one vocabulary for AVX's bookings and ADP's
# code_labor_op_map (G6-D2, user 2026-10-17). A booked fault op must be listed
# for its code in ADP's map, or the completed repair never clears the fault;
# a booked PM op must be listed for its task, or the task never shows current.
# Three op sets never share a name (option (a), user 2026-10-18): fault repairs
# (each stop-driving code has an op of its own; other codes their system's repair
# op), PM tasks (ordinary dealer service), and Agent 2 bookings, which ADP's map
# lists nowhere, so a completed Agent 2 booking clears no fault and completes no
# PM task. The band entries and loop.py's fallbacks book LAB-ELE-07, which ADP's
# map also lists nowhere.
# `adp_code_labor_op_map.json` beside this file is ADP's map, vendored and
# sha256-pinned; tests/test_labor_op_vocabulary.py checks every op here against it.
# parts may be empty ([]) when the service requires no pre-stocked parts.

# ---------------------------------------------------------------------------
# Fault needs — by fault band (only for a code not listed below)
# ---------------------------------------------------------------------------
fault_bands:
  p0:
    labor_op: "LAB-ELE-07"
    parts: []            # p0: dealer dispatches; no advance stock required
  attention:
    labor_op: "LAB-ELE-07"
    parts: []
  soon:
    labor_op: "LAB-ELE-07"
    parts: []

